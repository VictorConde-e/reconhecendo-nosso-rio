; Leitor NFC "Re-conhecendo nosso rio" — ESP32 + RC522
; Compilar/gravar:  pio run -t upload   |   Monitor serial:  pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
